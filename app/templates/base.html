<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <div class="brand-lockup">
    <span class="brand-mark">BC</span>
    <span><strong>{{ app_name }}</strong>{% if environment %}<small>{{ environment }}</small>{% endif %}</span>
  </div>
  {% if username %}
  <div class="header-actions">
    <span>{{ username }}</span>
    <form method="post" action="/logout"><button class="button button-outline" type="submit">Sign out</button></form>
  </div>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
